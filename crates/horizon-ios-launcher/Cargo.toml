[package]
name = "horizon-ios-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Shows the SwiftUI launcher (packaging/ios/Launcher) over the game on iPhone and iPad"

# Empty everywhere but iOS: the launcher is a Swift framework only an iOS bundle carries.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
log = "0.4"

[lints]
workspace = true

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.5.2"

[target.'cfg(target_os = "ios")'.dependencies.objc2-foundation]
version = "0.2.2"
features = ["NSNotification", "NSThread", "NSString", "NSSet", "NSUserDefaults"]

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.2.2"
features = ["UIApplication", "UIResponder", "UIScene", "UISceneSession", "UISceneOptions", "UIWindowScene", "UIWindow", "UIView", "UIViewController", "UITouch", "UIEvent"]

[target.'cfg(target_os = "ios")'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.objc2-new]
package = "objc2"
version = "0.6.5"

[target.'cfg(target_os = "ios")'.dependencies.block2]
version = "0.6.2"

[target.'cfg(target_os = "ios")'.dependencies.objc2-game-controller]
version = "0.3.2"
features = ["block2", "objc2-core-foundation"]
